name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Room integration tests
        run: pnpm test

      - name: Build and check assets
        run: pnpm build

      - name: Check production container
        run: |
          docker build --tag lolm-roll:test .
          docker run --detach --name lolm-roll-test --publish 127.0.0.1:3000:3000 lolm-roll:test
          trap 'docker logs lolm-roll-test; docker rm --force lolm-roll-test' EXIT
          curl --fail --max-time 5 --retry 10 --retry-delay 1 --retry-all-errors http://127.0.0.1:3000/api/health
          curl --fail --output /dev/null http://127.0.0.1:3000/room/123456
          curl --fail --output /dev/null --request POST --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:3000/api/rooms
